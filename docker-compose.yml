      context: ./tournament-service
      dockerfile: Dockerfile
    container_name: tournament-service-1
    environment:
      # ✅ FIXED: Use Atlas URI consistently
      - MONGO_URI=mongodb+srv://kodzgen_db_user:ynJstHDzJp1kr8j1@cluster67.uccsl1k.mongodb.net/?appName=Cluster67
      - DB_NAME=tournamentdb
      - APP_NAME=Tournament Service
      - JWT_SECRET=${JWT_SECRET:-supersecret12345}  # ✅ FIXED: Same secret as auth
      - JWT_ALG=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=*
    networks:
      - qushcup-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  tournament-service-2:
    build:
      context: ./tournament-service
      dockerfile: Dockerfile
    container_name: tournament-service-2
    environment:
      - MONGO_URI=mongodb+srv://kodzgen_db_user:ynJstHDzJp1kr8j1@cluster67.uccsl1k.mongodb.net/?appName=Cluster67
      - DB_NAME=tournamentdb
      - APP_NAME=Tournament Service
      - JWT_SECRET=${JWT_SECRET:-supersecret12345}  # ✅ FIXED: Same secret
      - JWT_ALG=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=*
    networks:
