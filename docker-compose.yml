
version: '3.8'

services:
  # ==================== AUTH SERVICE ====================
  auth-service-1:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service-1
    ports:
      - "8080:8000"  # ← ADDED: Expose auth service
    environment:
      # ✅ FIXED: Use Atlas URI (same as other services)
      - MONGO_URI=mongodb+srv://kodzgen_db_user:ynJstHDzJp1kr8j1@cluster67.uccsl1k.mongodb.net/?appName=Cluster67
      - DB_NAME=authdb
      - APP_NAME=Auth Service
      - JWT_SECRET=${JWT_SECRET:-supersecret12345}
      - JWT_ALG=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=*
    # ✅ FIXED: Remove mongo dependency (using Atlas)
    networks:
      - qushcup-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  auth-service-2:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service-2
    environment:
      # ✅ FIXED: Use Atlas URI
      - MONGO_URI=mongodb+srv://kodzgen_db_user:ynJstHDzJp1kr8j1@cluster67.uccsl1k.mongodb.net/?appName=Cluster67
      - DB_NAME=authdb
      - APP_NAME=Auth Service
      - JWT_SECRET=${JWT_SECRET:-supersecret12345}
      - JWT_ALG=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=*
    networks:
      - qushcup-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ==================== TOURNAMENT SERVICE ====================
  tournament-service-1:
